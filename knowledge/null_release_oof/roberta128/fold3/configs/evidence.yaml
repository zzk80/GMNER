model:
  input_size: 256
  hidden_size: 256
  num_candidate_sources: 4
  source_embedding_size: 32
  dropout: 0.2
  residual_scale: 4.0
loss:
  lambda_bce: 1.0
  lambda_visible_correction: 1.0
  lambda_null_preservation: 1.0
