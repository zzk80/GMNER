  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 10
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
runtime:
  seed: 42
  device: cuda
  fp16: true
  output_dir: /home/zzk/gmner/outputs/null_release_oof/roberta128/fold3/evidence
  save_best_metric: gmner_score
