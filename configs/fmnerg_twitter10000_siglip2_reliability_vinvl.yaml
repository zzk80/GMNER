data:
  formal_train_cache: knowledge/record_candidates/roberta128/fmnerg_train_hierarchical.pt
  expanded_train_cache: knowledge/record_candidates/roberta128/fmnerg_train_hierarchical_r36.pt
  formal_dev_cache: knowledge/record_candidates/roberta128/fmnerg_dev_hierarchical.pt
  expanded_dev_cache: knowledge/record_candidates/roberta128/fmnerg_dev_hierarchical_r36.pt
  num_workers: 0
  require_oof_train_cache: false
  verify_siglip2_cache_hashes: true

frozen:
  fine_config: configs/fmnerg_twitter10000_fine_grounding_adapter.yaml
  fine_checkpoint: outputs/fmnerg_roberta128_fine_grounding_adapter/best_model.pt
  evidence_visibility_config: configs/fmnerg_twitter10000_evidence_visibility.yaml
  evidence_visibility_checkpoint: outputs/fmnerg_roberta128_evidence_visibility/best_model.pt

model:
  feature_mode: vinvl_only
  input_size: 256
  hidden_size: 256
  num_candidate_sources: 4
  source_embedding_size: 32
  dropout: 0.2
  siglip2_candidate_temperature: 1.0

loss: &reliability_loss
  lambda_quality_focal: 1.0
  lambda_positive_max: 0.5
  lambda_null_suppress: 0.5
  lambda_rank: 0.5
  lambda_brier: 0.2
  lambda_hard_ab_bce: 1.0
  lambda_hard_ab_rank: 0.5
  quality_focal_gamma: 2.0
  rank_margin: 0.5
  hard_ab_rank_margin: 0.5
  low_iou: 0.1
  positive_iou: 0.5
  hard_negative_count: 4
  other_entity_negative_count: 2
  compatibility_negative_count: 2
  group_a_weight: 0.30
  group_b_weight: 0.30
  group_null_weight: 0.20
  group_ordinary_weight: 0.20
  positive_pair_weight: 2.0
  high_score_negative_weight: 2.0
  promoted_negative_weight: 1.5
  other_entity_negative_weight: 1.5
  compatibility_negative_weight: 1.5

evaluation: &reliability_evaluation
  reliability_threshold: 0.5
  null_preservation_floor: 0.98
  calibration_bins: 10
  detector_reference_budget: 16
  minimum_hard_ab_auc: 0.70
  minimum_balanced_accuracy: 0.62
  minimum_risk_net_correction: 15
  minimum_promoted_fix_count: 1

optim: &reliability_optim
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 10
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

runtime:
  seed: 42
  device: cuda
  fp16: true
  output_dir: outputs/fmnerg_roberta128_siglip2_reliability_vinvl
  early_stop_patience: 3
  log_every_steps: 50
