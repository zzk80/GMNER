data:
  train_cache: knowledge/stage1_candidate_selector_oof/roberta128/train_candidates.pt
  dev_cache: knowledge/stage1_candidate_selector_oof/roberta128/dev_candidates.pt
  phase1_audit: knowledge/stage1_candidate_selector_oof/roberta128/phase1_audit.json
  num_workers: 0

model:
  input_size: 768
  hidden_size: 256
  num_sources: 4
  dropout: 0.2
  formal_prior: 0.5
  nonformal_prior: -0.5
  residual_scale: 1.0

optim:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 12
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

loss:
  lambda_entity: 1.0
  lambda_overlap_margin: 0.5
  lambda_residual: 0.05
  overlap_margin: 0.2

decode:
  threshold: 0.0
  strategy: weighted_interval

runtime:
  seed: 42
  device: cuda
  fp16: false
  output_dir: outputs/stage1_candidate_selector_seed42
  save_best_metric: span_f1
  save_best_tie_breakers:
    - mner_f1
    - gmner_score
  early_stop_patience: 3
  log_every_steps: 25
