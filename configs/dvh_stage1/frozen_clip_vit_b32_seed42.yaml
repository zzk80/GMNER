data:
  task_type: multimodal_ner
  dataset_name: twitter10000_dvh_stage1
  train_file: GMNER-main/Twitter10000_v2.0/txt_fine/train.txt
  dev_file: GMNER-main/Twitter10000_v2.0/txt_fine/dev.txt
  test_file: ""
  image_dir: GMNER-main/Twitter10000_v2.0/images
  image_feature_dir: GMNER-main/Twitter10000_v2.0/VinVL
  image_annotation_dir: GMNER-main/Twitter10000_v2.0/xml
  frozen_clip_feature_dir: knowledge/dvh_frozen_clip
  frozen_clip_cache_kind: dvh_frozen_clip_cache
  max_length: 128
  num_workers: 0
  use_dependency_graph: true
  dependency_backend: spacy
  dependency_model: en_core_web_sm
  graph_window_size: 2
  max_regions: 16
  grounding_iou_threshold: 0.5
  add_null_region: true
  grounding_enabled: true
  expand_entities_for_grounding: true
  groundability_type_priors: ""
  groundability_mention_priors: ""
  region_min_score: 0.0

model:
  text_model_name: /home/zzk/gmner/roberta-base
  hidden_size: 768
  projection_dim: 768
  dropout: 0.1
  graph_layers: 3
  graph_dropout: 0.1
  cross_attention_heads: 8
  region_feature_dim: 2048
  region_score_prior_weight: 0.1
  dvh_enabled: true
  dvh_use_clip: true
  dvh_use_vinvl: true
  dvh_shuffle_clip: false
  dvh_clip_feature_dim: 768
  dvh_clip_patch_grid_size: 7
  dvh_type_query_count: 4
  dvh_gate_initial_bias: -2.0
  dvh_boundary_visual: true
  dvh_type_visual: true
  dvh_grounding_visual: true

optim:
  batch_size: 8
  learning_rate: 2e-5
  new_module_learning_rate: 1e-4
  high_level_learning_rate: 1e-5
  backbone_learning_rate: 3e-6
  weight_decay: 0.01
  num_epochs: 20
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

loss:
  label_smoothing: 0.0
  lambda_boundary: 1.0
  lambda_type: 1.0
  lambda_grounding: 1.0
  lambda_alignment: 0.1
  lambda_gate_regularization: 0.01

runtime:
  seed: 42
  device: cuda
  fp16: true
  output_dir: outputs/dvh_stage1/frozen_clip_vit_b32_seed42
  init_checkpoint: ""
  trainable_modules: all
  save_best_metric: gmner_score
  save_latest_checkpoint: false
  early_stopping_patience: 3
  log_every_steps: 20
