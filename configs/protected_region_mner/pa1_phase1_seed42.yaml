data:
  task_type: multimodal_ner
  dataset_name: twitter10000_fmnerg
  train_file: GMNER-main/Twitter10000_v2.0/txt_fine/train.txt
  dev_file: GMNER-main/Twitter10000_v2.0/txt_fine/dev.txt
  test_file: GMNER-main/Twitter10000_v2.0/txt_fine/test.txt
  image_dir: GMNER-main/Twitter10000_v2.0/images
  image_feature_dir: GMNER-main/Twitter10000_v2.0/VinVL
  image_annotation_dir: GMNER-main/Twitter10000_v2.0/xml
  max_length: 128
  num_workers: 0
  use_dependency_graph: true
  dependency_backend: spacy
  dependency_model: en_core_web_sm
  graph_window_size: 2
  max_regions: 16
  grounding_iou_threshold: 0.5
  add_null_region: true
  grounding_enabled: true
  expand_entities_for_grounding: true
  groundability_type_priors: knowledge/grounding/groundability_by_type.jsonl
  groundability_mention_priors: knowledge/grounding/groundability_by_mention_type.jsonl
  region_min_score: 0.0

model:
  text_model_name: /home/zzk/gmner/roberta-base
  hidden_size: 768
  projection_dim: 768
  dropout: 0.1
  graph_layers: 3
  graph_dropout: 0.1
  cross_attention_heads: 8
  use_crf: true
  region_feature_dim: 2048
  grounding_null_prior_weight: 1.0
  grounding_null_logit_bias: 0.0
  region_score_prior_weight: 0.1
  region_object_compatibility_weight: 0.2

  use_protected_region_mner: true
  protected_region_bottleneck_size: 512
  protected_region_gate_hidden_size: 128
  protected_region_dropout: 0.1
  protected_mner_attention_heads: 8
  protected_mner_attention_dropout: 0.1
  protected_mner_gate_hidden_size: 128
  protected_mner_gate_max: 0.3
  protected_mner_exclude_null: true
  protected_mner_grounding_use_refined_text: false
  protected_mner_grounding_use_refined_regions: false

optim:
  batch_size: 8
  learning_rate: 5.0e-5
  new_module_learning_rate: 1.0e-4
  weight_decay: 0.01
  num_epochs: 3
  warmup_ratio: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

loss:
  label_smoothing: 0.0
  lambda_ner: 1.0
  lambda_grounding: 1.0
  lambda_alignment: 0.1
  lambda_protected_boundary_preserve: 0.1
  lambda_protected_visual_type: 0.05
  lambda_protected_visual_gate: 0.01
  lambda_protected_region_residual: 0.0001

runtime:
  seed: 42
  device: cuda
  fp16: true
  output_dir: outputs/protected_region_mner/pa1_phase1_seed42
  init_checkpoint: outputs/fmnerg_stage1_roberta128/best_model.pt
  trainable_modules: protected_mner,ner_classifier
  save_best_metric: entity_f1
  save_latest_checkpoint: false
  early_stopping_patience: 0
  eval_frozen_modules: true
  log_every_steps: 20
