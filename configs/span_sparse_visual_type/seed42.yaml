data:
  train_cache: knowledge/span_sparse_visual_type/seed42/train.pt
  dev_cache: knowledge/span_sparse_visual_type/seed42/dev.pt

model:
  span_size: 2304
  region_size: 768
  hidden_size: 256
  scalar_count: 11
  reliability_count: 6
  top_k: 3
  dropout: 0.1
  residual_scale: 2.0

loss:
  lambda_region: 1.0
  lambda_type: 1.0
  lambda_preserve: 1.0
  lambda_delta: 0.05
  wrong_type_weight: 3.0
  correct_type_weight: 0.5

optim:
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 15
  gradient_clip_norm: 1.0

runtime:
  seed: 42
  output_dir: outputs/span_sparse_visual_type/seed42
