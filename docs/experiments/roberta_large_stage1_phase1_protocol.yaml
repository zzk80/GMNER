kind: roberta_large_stage1_phase1_protocol
format_version: 1

scope:
  split: dev
  seed: 42
  test_accessed: false
  phase2_enabled: false

baseline:
  name: roberta_base_stage1
  config: configs/fmnerg_twitter10000_stage1.yaml
  checkpoint: outputs/fmnerg_stage1_roberta128/best_model.pt
  metrics:
    span_f1: 0.8707209021345148
    token_f1: 0.8429118723928265
    entity_f1: 0.8147402285860033
    grounding_accuracy: 0.7583760346866377
    eeg_f1: 0.6459927507047926
    gmner_score: 0.6073298429319373

candidate:
  name: roberta_large_stage1
  config: configs/fmnerg_twitter10000_stage1_roberta_large.yaml
  model_path: /home/zzk/gmner/roberta-large
  output_dir: outputs/fmnerg_stage1_roberta_large_seed42

controlled_changes:
  model:
    - text_model_name
  optim:
    - batch_size
    - gradient_accumulation_steps
  runtime:
    - output_dir
  effective_batch_size_must_match: true
  shared_hidden_size: 768

gate:
  span_f1_minimum_delta: 0.01
  entity_f1_minimum_delta: 0.01
  capacity_signal_logic: or
  eeg_f1_minimum_delta: -0.002
  gmner_score_minimum_delta: -0.002
  require_safety_checks: true

decision:
  on_pass: build_dev_and_train_r16_then_run_phase2
  on_no_go: archive_as_negative_capacity_result
  test_before_phase2: false
