taxonomy: sidecars/fmnerg_subtype/taxonomy_twitter10000.json

data:
  train_source: GMNER-main/Twitter10000_v2.0/txt_fine/train.txt
  dev_source: GMNER-main/Twitter10000_v2.0/txt_fine/dev.txt
  train_expanded_cache: knowledge/record_candidates/roberta128/fmnerg_train_hierarchical_r36.pt
  dev_expanded_cache: knowledge/record_candidates/roberta128/fmnerg_dev_hierarchical_r36.pt
  dev_formal_predictions: knowledge/fmnerg_subtype_sidecar/roberta128/dev_formal_predictions.json

initialization:
  subtype_encoder_config: sidecars/fmnerg_subtype/roberta128_encoder_all.yaml
  subtype_checkpoint_pattern: outputs/fmnerg_roberta128_subtype_encoder_ablation/all_seed{seed}/best_model.pt

model:
  stage: j0
  text_feature_size: 2304
  region_feature_size: 768
  geometry_size: 4
  hidden_size: 768
  dropout: 0.1
  residual_scale: 2.0

loss:
  lambda_fused: 1.0
  lambda_text: 0.25
  lambda_residual: 0.01

optim:
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 1
  fusion_learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 12
  warmup_ratio: 0.1
  early_stop_patience: 3
  gradient_clip_norm: 1.0

runtime:
  seed: 42
  device: cuda
  mixed_precision: true
  output_dir: outputs/fmnerg_joint_j0_seed42
  expected_dev_gmner_f1: 0.621316108
  expected_dev_gmner_tolerance: 0.0000005
  expected_initial_fmnerg_f1: null
  expected_initial_fmnerg_tolerance: 0.0000005
